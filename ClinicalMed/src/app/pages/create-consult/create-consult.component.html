<div class="welcome-container" [class.sidebar-expanded]="isSidebarExpanded">
  <app-sidebar-doctor [isExpanded]="isSidebarExpanded" [version]="version"></app-sidebar-doctor>

  <div class="main-content">
    <div class="calendar-container">
      <h2>Agendamento de Consultas</h2>

      <div class="calendar-container-input-calendar">
        <div class="calendar-navigation">
          <button (click)="previousWeek()">Semana Anterior</button>
          <button (click)="today()">Hoje</button>
          <button (click)="nextWeek()">Próxima Semana</button>
        </div>

        <mwl-calendar-week-view [viewDate]="viewDate" [events]="events"
          (hourSegmentClicked)="handleHourSegmentClick($event)" [hourSegments]="2" [dayStartHour]="8" [dayEndHour]="18"
          [locale]="locale">
        </mwl-calendar-week-view>
      </div>
    </div>
  </div>
</div>

<!-- Modal -->
<div *ngIf="visible" class="custom-modal-overlay">
  <div class="custom-modal">
    <!-- LOADER -->
    <div *ngIf="isLoading" class="loader-overlay">
      <div class="spinner"></div>
    </div>

    <h3>Novo Agendamento</h3>
    <p>Preencha as informações abaixo:</p>

    <label>
      Tipo de Atendimento:
      <select [(ngModel)]="selectedTypeAppointmentId">
        <option [ngValue]="null">Selecione</option>
        <option *ngFor="let type of typesAppointment" [ngValue]="type.id">
          {{ type.description }}
        </option>
      </select>
    </label>

    <label *ngIf="roleuserActivite === 'doctor'">
      Enfermeira(o) da consulta:
      <input type="text" [(ngModel)]="doctorName" disabled />
    </label>

    <label *ngIf="roleuserActivite !== 'doctor'">
      Informe o médico de sua preferência:
      <select [(ngModel)]="doctorId">
        <option [ngValue]="null">Selecione</option>
        <option *ngFor="let med of ListDoctors" [ngValue]="med.id">
          {{ med.firstName }}
        </option>
      </select>
    </label>

    <label *ngIf="roleuserActivite === 'doctor'">
      Escolha um paciente:
      <select [(ngModel)]="patientID">
        <option [ngValue]="null">Selecione</option>
        <option *ngFor="let patient of ListPatients" [ngValue]="patient.id">
          {{ patient.firstName }}
        </option>
      </select>
    </label>

    <label *ngIf="roleuserActivite != 'doctor'">
      Paciente:
      <input type="text" [(ngModel)]="patientName" disabled />
    </label>

    <label>
      Desconto (%):
      <input type="number" step="0.1" [(ngModel)]="descont" />
    </label>

    <div class="modal-buttons">
      <button (click)="visible = false">Cancelar</button>
      <button (click)="saveEvent()">Salvar</button>
    </div>
  </div>
</div>
