<form *ngIf="formSelected" [formGroup]="formSelected" (ngSubmit)="onSubmit()" class="container__infos">
  
  <ng-container *ngIf="roleUser === 'doctor'">
    <app-sidebar-doctor></app-sidebar-doctor>
  </ng-container>

  <ng-container *ngIf="roleUser != 'doctor'">
    <app-sidebar-patient></app-sidebar-patient>
  </ng-container>

  <div class="content">
    <h1>
      {{ namePatient }},<br />
      Aqui você pode alterar seus dados mais importantes
    </h1>

    <div 
      class="container__infos_patient" 
      *ngFor="let field of roleUser === 'doctor' ? formFieldsDoctor : formFieldsPatient">
      
      <div class="field-group">
        <input 
          type="text" 
          [formControlName]="field.controlName" 
          [placeholder]="field.placeholder" 
        />

        <div class="field-actions">
          <button type="button" (click)="editField(field.controlName)">✎</button>
          <button type="button" (click)="cancelEdit(field.controlName)">✖</button>
        </div>
      </div>
    </div>

    <button 
      type="submit" 
      class="save-button" 
      [disabled]="isSaveDisabled">
      Salvar edições
    </button>
  </div>
</form>
