<nav [class.expanded]="isExpanded" class="sidebar">
    <div class="sidebar-content">
      <button
        class="toggle-btn"
        (click)="toggleSidebar()"
        [class.rotated]="isExpanded"
      >
        ☰
      </button>

      <ul>
        <li (click)="goToWelcomeDoctor()">
          <span class="icon">🏠</span>
          <span *ngIf="isExpanded" > Início </span>
        </li>
        <li (click)="gotoDetailsDoctor()">
          <span class="icon">👤</span>
          <span *ngIf="isExpanded" > Perfil </span>
        </li>
        <li>
          <span class="icon">📅</span>
          <span *ngIf="isExpanded"> Consultas </span>
        </li>
        <li (click)="exitSystem()">
          <span class="icon">🚪</span>
          <span *ngIf="isExpanded" > Sair </span>
        </li>
      </ul>
    </div>

    <div class="version-box">
      <span>Versão {{ version }}</span>
    </div>
  </nav>
